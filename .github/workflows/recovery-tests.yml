name: Recovery checks
on:
  push:
    branches:
      - fix/bud-recovery-2026-11-04
      - feat/alien-observer-offline-2026-11-04
  pull_request:
    branches:
      - master
      - fix/bud-recovery-2026-11-04
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q core bud_logic bud_editor_service bud_interpreter_service bud_guardian_service bud_commander_service telegram_integration utils tests alien_bridge
      - name: Run tests
        run: python -m pytest -q tests
